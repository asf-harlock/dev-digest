name: DevDigest Review
on:
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run DevDigest review
        run: node .devdigest/runner/index.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_POST_AS: pr_comment
      - name: Record run metadata
        if: always()
        run: printf '{"commit_sha":"%s","repository":"%s","pr_number":%s}\n' "$DEVDIGEST_COMMIT_SHA" "$DEVDIGEST_REPOSITORY" "$DEVDIGEST_PR_NUMBER" > devdigest-run.json
        env:
          DEVDIGEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DEVDIGEST_REPOSITORY: ${{ github.repository }}
          DEVDIGEST_PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devdigest-result
          path: |-
            devdigest-result.json
            devdigest-run.json
          if-no-files-found: warn
